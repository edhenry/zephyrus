[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zeph-tui"
version = "0.1.0"
description = "Zephyrus Command Center TUI dashboard"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.47.0",
    "httpx>=0.27",
    "websockets>=12.0",
]

[project.scripts]
zeph-tui = "zeph_tui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["zeph_tui"]
