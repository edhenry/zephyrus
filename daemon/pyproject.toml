[project]
name = "zephd"
version = "0.1.0"
description = "Zephyrus Command Center coordination daemon"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "aiosqlite>=0.20.0",
    "ulid-py>=1.1.0",
    "websockets>=13.0",
    "pydantic>=2.0",
]

[project.scripts]
zephd = "zephd.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
