# Kitty Config with macOS shortcuts + Nordic theme + tmux auto-start
include ./theme.conf

# Let TMUX drive tab naming
tab_title_template "{title}"

# Fonts (use Nerd Font variant for Powerline glyphs in tmux)
font_family               FiraCode Nerd Font
bold_font                 auto
italic_font               auto
font_size                 15.0
enable_ligatures          always
adjust_line_height        105%

cursor_shape              block
# If text looks too thin on macOS external monitors
# text_composition_strategy high-quality
background_opacity        0.92
macos_titlebar_color      background

# --- macOS-style shortcuts ---
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+a select_all
map cmd+t new_tab
map cmd+w close_tab
map cmd+shift+[ previous_tab
map cmd+shift+] next_tab
map cmd+= increase_font_size
map cmd+- decrease_font_size
map cmd+0 reset_font_size
map cmd+ctrl+f toggle_fullscreen

# Search (Cmd+F)
map cmd+f launch --allow-remote-control kitty @ kitten search

# Make Option behave like Alt (Meta)
macos_option_as_alt yes
macos_cmd_modifier ctrl   # lets Cmd map to Ctrl-seqs apps expect

# ----- Word movement / deletion -----
map alt+left  send_text all \x1b[1;3D
map alt+right send_text all \x1b[1;3C
map alt+backspace send_text all \x1b\x7f
map alt+delete    send_text all \x1b[3;3~

# ----- Line start/end via Cmd (sends Ctrl-A / Ctrl-E) -----
map cmd+left  send_text all \x01
map cmd+right send_text all \x05

# Page Up/Down (pass through)
map page_up   send_text all \x1b[5~
map page_down send_text all \x1b[6~

# Send Meta/Alt + '.' when you press Cmd+.
map cmd+. send_text all \x1b.

# Local search inside tmux scrollback
# map cmd+f send_text all "\x1b[?1000l" ; send_text all "\x1b[?1002l" ; send_text all "\x1b[?1003l" ; send_text all "\x17/"

map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+shift+v paste_from_selection


# Treat Cmd as Ctrl so Cmd+P behaves like Ctrl+P, etc.
macos_cmd_modifier ctrl

# (optional) Make Option send Alt/meta (good for Vim/Emacs)
macos_option_as_alt yes

# Scrollback + zoom
scrollback_lines 15000
mouse_map ctrl+scroll_up   kitten:zoom_in
mouse_map ctrl+scroll_down kitten:zoom_out

# Quality of life
confirm_os_window_close 0
allow_remote_control yes

# OPTIONAL: Kitty shortcuts that send tmux pane switches (uses prefix C-a)
# Hold Cmd+Opt and press h/j/k/l to move panes
map cmd+alt+h send_text all \x01h
map cmd+alt+j send_text all \x01j
map cmd+alt+k send_text all \x01k
map cmd+alt+l send_text all \x01l

# Auto-start tmux session 'main' in every new kitty window 
# shell zsh -l -c 'tmux new-session -A -s "kitty_tab_#{kitty_window_number}"'
shell zsh -l -c 'tmux new-session -s "kitty-$(date +%s%N)"'
# shell zsh -l -c 'SESSION=$(basename "$PWD"); tmux new -A -s "$SESSION"'
