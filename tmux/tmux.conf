# Let tmux set the terminal/window title
set -g set-titles on
set -g set-titles-string '#W'          # what kitty will see as {title}

# Do NOT let apps (zsh, vim, etc.) rename tmux windows
set -g allow-rename off

# Auto-rename windows based on what's running; if it's zsh, use folder name
set -g automatic-rename on
set -g automatic-rename-format '#{?#{==:#{pane_current_command},zsh},#{pane_current_path:t},#{pane_current_command}}'

# Advertise a modern term and enable 24-bit color passthrough
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-kitty:RGB'
set -ga terminal-overrides ',*:Tc'

##### TPM (Plugin Manager) #####
# Ensure TPM is installed: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-save/restore sessions
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

##### General #####
set -g mouse on
set -g xterm-keys on
set -s escape-time 0

# Unbind common Alt collisions (letters + arrows + delete)
unbind-key -T root M-Left
unbind-key -T root M-Right
unbind-key -T root M-b
unbind-key -T root M-f
unbind-key -T root M-BSpace
unbind-key -T root M-Delete
unbind-key -T root WheelUpStatus

unbind -n M-.

bind -n M-Left   send-keys -l "\e[1;3D"
bind -n M-Right  send-keys -l "\e[1;3C"
bind -n M-BSpace send-keys -l "\e\x7f"       # Alt+Backspace => ESC + DEL(0x7f)
bind -n M-Delete send-keys -l "\e[3;3~"      # Alt+Delete   => CSI 3;3~
bind -n M-b send-keys -l "\eb"
bind -n M-f send-keys -l "\ef"

# Smart PageUp/PageDown:
# - In full-screen apps (alternate screen) → send to the app
# - Otherwise → use tmux copy-mode to scroll history
unbind -n PageUp
unbind -n PageDown
bind -n PageUp   if -F '#{alternate_on}' 'send-keys PageUp'   'copy-mode -e; send-keys -X halfpage-up'
bind -n PageDown if -F '#{alternate_on}' 'send-keys PageDown' 'send-keys -X halfpage-down'


set -g history-limit 20000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Pass wheel events through to the pane (k9s) instead of entering copy mode
unbind -n WheelUpPane
unbind -n WheelDownPane
bind -n WheelUpPane   if -F '#{alternate_on}' 'send-keys -M' 'if -F "#{pane_in_mode}" "send-keys -M" "copy-mode -e"'
bind -n WheelDownPane if -F '#{alternate_on}' 'send-keys -M' 'send-keys -M'


# Better defaults
set -g escape-time 10
set -g focus-events on

##### Prefix & Keys #####
unbind C-b
set -g prefix C-a
bind C-a send-prefix
set-window-option -g mode-keys vi   # vi-style copy mode (/ to search)

# Splits
bind | split-window -h
bind - split-window -v

# Navigate panes (no prefix)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Resize panes (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Windows
bind c new-window
#bind -n M-Left  previous-window
#bind -n M-Right next-window

##### Status Bar — Nordic palette #####
# bg: #242933 (gray0), fg: #BBC3D4 (white0)
# blue: #81A1C1, cyan: #8FBCBB, green: #A3BE8C
# yellow: #EBCB8B, orange: #D08770, magenta: #B48EAD
set -g status on
set -g status-interval 5
set -g status-justify centre
set -g status-position bottom

set -g status-style "bg=#242933,fg=#BBC3D4"

# Message / command prompt
set -g message-style "bg=#2E3440,fg=#EBCB8B"

# Left: session name
set -g status-left-length 60
set -g status-left "#[fg=#242933,bg=#81A1C1,bold] #{session_name} #[fg=#81A1C1,bg=#242933] "

# Inactive windows
setw -g window-status-format " #[fg=#4C566A]#I:#W "
# Active window
setw -g window-status-current-format "#[fg=#242933,bg=#A3BE8C,bold] #I:#W #[fg=#A3BE8C,bg=#242933]"

# Right: git, venv, CPU load, battery, wifi, time
set -g status-right-length 120
set -g status-right "#[fg=#EBCB8B]#(~/.config/tmux/bin/git_branch.sh \"#{pane_current_path}\")\
 #[fg=#A3BE8C]#(~/.config/tmux/bin/venv_name.sh \"#{pane_current_path}\")\
 #[fg=#8FBCBB]#(~/.config/tmux/bin/system_stats.sh)\
 #[fg=#BBC3D4] %Y-%m-%d %H:%M "

##### Clipboard (macOS) #####
set-option -g set-clipboard on

##### Enable TPM #####
run '~/.tmux/plugins/tpm/tpm'

##### Override after TPM (plugins can clobber styles) #####
run-shell 'sleep 0.5 && \
  tmux setw -g window-style "fg=#BBC3D4,bg=#242933" && \
  tmux setw -g window-active-style "fg=default,bg=terminal" && \
  tmux set -g pane-border-style "fg=#3B4252" && \
  tmux set -g pane-active-border-style "fg=#81A1C1,bold" && \
  tmux set -g pane-border-lines heavy && \
  tmux set -g pane-border-indicators arrows'
