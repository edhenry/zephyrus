# Let tmux set the terminal/window title
set -g set-titles on
set -g set-titles-string '#W'          # what kitty will see as {title}

# Do NOT let apps (zsh, vim, etc.) rename tmux windows
set -g allow-rename off

# Auto-rename windows based on what's running; if it's zsh, use folder name
set -g automatic-rename on
set -g automatic-rename-format '#{?#{==:#{pane_current_command},zsh},#{pane_current_path:t},#{pane_current_command}}'

# Advertise a modern term and enable 24-bit color passthrough
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-kitty:RGB'
set -ga terminal-overrides ',*:Tc'

# Make panes inherit the terminal's (Kitty) default fg/bg
setw -g window-style 'fg=default,bg=default'
setw -g window-active-style 'fg=default,bg=default'

# ===== Chalkboard-style colours for tmux status bar =====
set -g status on
set -g status-interval 5
set -g status-position bottom

# Use Chalkboard-palette-like colours:
# Background = slightly dark (#2b2b2b)
# Foreground = light pastel (#e6e1dc)
set -g status-style "bg=#2b2b2b, fg=#e6e1dc"

# Inactive windows
setw -g window-status-style "bg=#2b2b2b, fg=#747369"
# Active window
setw -g window-status-current-style "bg=#3a3a3a, fg=#eeeeee"

# Left side: session name
set -g status-left-length 60
set -g status-left "#[fg=#2b2b2b,bg=#8f9d6a] #{session_name} #[fg=#8f9d6a,bg=#2b2b2b] #[fg=#e6e1dc,bg=#2b2b2b]#I:#W "

# Right side: system info etc.
set -g status-right-length 120
set -g status-right "#[fg=#cda869]#(~/.config/tmux/bin/git_branch.sh \"#{pane_current_path}\") #[fg=#8f9d6a]#(~/.config/tmux/bin/venv_name.sh \"#{pane_current_path}\") #[fg=#b5d3f3]#(~/.config/tmux/bin/system_stats.sh) #[fg=#e6e1dc] %Y-%m-%d %H:%M "


##### TPM (Plugin Manager) #####
# Ensure TPM is installed: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-save/restore sessions
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

##### General #####
set -g mouse on
set -g xterm-keys on
set -s escape-time 0

# Unbind common Alt collisions (letters + arrows + delete)
unbind-key -T root M-Left
unbind-key -T root M-Right
unbind-key -T root M-b
unbind-key -T root M-f
unbind-key -T root M-BSpace
unbind-key -T root M-Delete
unbind-key -T root WheelUpStatus

unbind -n M-.

bind -n M-Left   send-keys -l "\e[1;3D"
bind -n M-Right  send-keys -l "\e[1;3C"
bind -n M-BSpace send-keys -l "\e\x7f"       # Alt+Backspace => ESC + DEL(0x7f)
bind -n M-Delete send-keys -l "\e[3;3~"      # Alt+Delete   => CSI 3;3~
bind -n M-b send-keys -l "\eb"
bind -n M-f send-keys -l "\ef"

# Smart PageUp/PageDown:
# - In full-screen apps (alternate screen) → send to the app
# - Otherwise → use tmux copy-mode to scroll history
unbind -n PageUp
unbind -n PageDown
bind -n PageUp   if -F '#{alternate_on}' 'send-keys PageUp'   'copy-mode -e; send-keys -X halfpage-up'
bind -n PageDown if -F '#{alternate_on}' 'send-keys PageDown' 'send-keys -X halfpage-down'


set -g history-limit 20000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Pass wheel events through to the pane (k9s) instead of entering copy mode
unbind -n WheelUpPane
unbind -n WheelDownPane
bind -n WheelUpPane   if -F '#{alternate_on}' 'send-keys -M' 'if -F "#{pane_in_mode}" "send-keys -M" "copy-mode -e"'
bind -n WheelDownPane if -F '#{alternate_on}' 'send-keys -M' 'send-keys -M'


# Better defaults
set -g escape-time 10
set -g focus-events on

##### Prefix & Keys #####
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Splits
bind | split-window -h
bind - split-window -v

# Navigate panes (no prefix)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Resize panes (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Windows
bind c new-window
#bind -n M-Left  previous-window
#bind -n M-Right next-window

##### Status Bar (Powerline-style) #####
set -g status on
set -g status-interval 5
set -g status-justify centre
set -g status-position bottom

# Colors to roughly match Chalkboard
set -g status-style "bg=#2b2b2b,fg=#e6e1dc"

# Left: session ▸ window ◂
set -g status-left-length 60
set -g status-left "#[fg=#2b2b2b,bg=#8f9d6a] #{session_name} #[fg=#8f9d6a,bg=#2b2b2b] #[fg=#e6e1dc,bg=#2b2b2b]#I:#W "

# Inactive windows
setw -g window-status-format " #[fg=#747369]#I:#W "
# Active window (highlight)
setw -g window-status-current-format "#[fg=#2b2b2b,bg=#cda869]#[fg=#2b2b2b,bg=#cda869] #I:#W #[fg=#cda869,bg=#2b2b2b]"

# Right: git, venv, CPU load, battery, wifi, time
set -g status-right-length 120
set -g status-right "#[fg=#cda869]#(~/.config/tmux/bin/git_branch.sh \"#{pane_current_path}\")\
 #[fg=#8f9d6a]#(~/.config/tmux/bin/venv_name.sh \"#{pane_current_path}\")\
 #[fg=#b5d3f3]#(~/.config/tmux/bin/system_stats.sh)\
 #[fg=#e6e1dc] %Y-%m-%d %H:%M "

##### Clipboard (macOS) #####
set-option -g set-clipboard on

##### Enable TPM at the very end #####
run '~/.tmux/plugins/tpm/tpm'
