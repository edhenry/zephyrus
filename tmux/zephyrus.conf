# Zephyrus tmux server config — minimal, no plugins.
# Loaded via `tmux -L zephyrus -f <this file>` to avoid conflicts with the
# user's ~/.tmux.conf (tmux-resurrect, tmux-continuum, etc.).

# Terminal & color
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-kitty:RGB'
set -ga terminal-overrides ',*:Tc'
setw -g window-style  'fg=default,bg=default'
setw -g window-active-style 'fg=default,bg=default'

# General
set -g mouse on
set -g xterm-keys on
set -s escape-time 0
set -g focus-events on
set -g history-limit 20000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set-option -g set-clipboard on

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Splits
bind | split-window -h
bind - split-window -v

# Navigate panes (no prefix)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Resize panes (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Status bar — Chalkboard palette
set -g status on
set -g status-interval 5
set -g status-justify centre
set -g status-position bottom
set -g status-style "bg=#2b2b2b,fg=#e6e1dc"
set -g status-left-length 60
set -g status-left "#[fg=#2b2b2b,bg=#8f9d6a] #{session_name} #[fg=#8f9d6a,bg=#2b2b2b] "
setw -g window-status-format " #[fg=#747369]#I:#W "
setw -g window-status-current-format "#[fg=#2b2b2b,bg=#cda869] #I:#W #[fg=#cda869,bg=#2b2b2b]"
set -g status-right-length 40
set -g status-right "#[fg=#e6e1dc] %H:%M "
