[project]
name = "zeph-cli"
version = "0.1.0"
description = "Zephyrus Command Center CLI"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.scripts]
zeph = "zeph.main:app"

[tool.hatch.build.targets.wheel]
packages = ["zeph"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
