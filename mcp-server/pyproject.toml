[project]
name = "zeph-mcp"
version = "0.1.0"
description = "Zephyrus MCP server — exposes task stack tools to AI agents"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[project.scripts]
zeph-mcp = "zeph_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["zeph_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
